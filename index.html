<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: file:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    >
    <title>Chromium Browser</title>
    <link rel="icon" type="image/png" href="assets/browser-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="browser-chrome">
      <div class="tab-strip">
        <div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div>
        <div class="window-controls" aria-label="Window controls">
          <button id="window-minimize" class="window-control" type="button" aria-label="Minimize"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="window-maximize" class="window-control" type="button" aria-label="Maximize"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
          <button id="window-close" class="window-control close" type="button" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>
      </div>
      <form id="address-form" class="toolbar" role="search" aria-label="Browser toolbar and address search">
        <button id="back" class="icon-button" type="button" aria-label="Go back" title="Back"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg></button>
        <button id="forward" class="icon-button" type="button" aria-label="Go forward" title="Forward"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7M16 12H4"/></svg></button>
        <button id="reload" class="icon-button" type="button" aria-label="Reload page" title="Reload"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 1-2-4.9L20 12"/></svg></button>
        <div class="address-wrap">
          <span class="secure-mark" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <input
            id="address"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search or enter an address"
            aria-label="Search or enter an address"
          >
        </div>
        <button id="bookmark" class="icon-button bookmark-button" type="button" aria-label="Bookmark this page" title="Bookmark this page"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button>
        <button id="shields-button" class="icon-button shields-button" type="button" aria-label="Shields" aria-haspopup="dialog" aria-expanded="false" title="Shields"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.5 8.4-8 10-4.5-1.6-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg><span id="shields-count" class="shields-count" hidden>0</span></button>
        <button id="extensions-button" class="icon-button" type="button" aria-label="Extensions" aria-haspopup="dialog" aria-expanded="false" title="Extensions"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5A2.5 2.5 0 1 1 14 4.5V7h4a1 1 0 0 1 1 1v4h-2.5a2.5 2.5 0 1 0 0 5H19v3a1 1 0 0 1-1 1h-4v-2.5a2.5 2.5 0 1 0-5 0V21H6a1 1 0 0 1-1-1v-4H2.5a2.5 2.5 0 1 1 0-5H5V8a1 1 0 0 1 1-1h3V4.5Z"/></svg></button>
        <button id="browser-menu-button" class="icon-button menu-button" type="button" aria-label="Browser menu" aria-haspopup="menu" aria-expanded="false" title="Browser menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </form>
      <nav id="bookmarks-bar" class="bookmarks-bar" aria-label="Bookmarks"></nav>
      <div id="find-bar" class="find-bar" role="search" aria-label="Find in page" hidden>
        <label for="find-query">Find</label>
        <input id="find-query" type="search" autocomplete="off" aria-label="Text to find on this page">
        <span id="find-count" aria-live="polite">0 of 0</span>
        <label class="find-match-case"><input id="find-match-case" type="checkbox"> Match case</label>
        <button id="find-previous" class="secondary-button" type="button" aria-label="Previous match" title="Previous match">↑</button>
        <button id="find-next" class="secondary-button" type="button" aria-label="Next match" title="Next match">↓</button>
        <button id="find-close" class="secondary-button" type="button" aria-label="Close find bar" title="Close">×</button>
      </div>
    </header>
    <div id="browser-menu" class="browser-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-page="history">History <span>Ctrl+H</span></button>
      <button type="button" role="menuitem" data-page="bookmarks">Bookmarks <span>Ctrl+Shift+O</span></button>
      <button type="button" role="menuitem" data-page="shields">Shields</button>
      <button type="button" role="menuitem" data-page="extensions">Extensions</button>
      <button type="button" role="menuitem" data-page="downloads">Downloads</button>
      <button type="button" role="menuitem" data-page="settings">Settings <span>Ctrl+,</span></button>
    </div>
    <section id="shields-popup" class="shields-popup" role="dialog" aria-label="Site Shields" hidden></section>
    <section id="extensions-popup" class="shields-popup extensions-popup" role="dialog" aria-label="Extensions" hidden></section>
    <main id="internal-page" class="internal-page" hidden></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="renderer.js"></script>
  </body>
</html>
